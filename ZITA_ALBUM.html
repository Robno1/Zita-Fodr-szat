<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>ZITA</title>

<style>

/* =========================================================
   ALAP
========================================================= */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    background-image: url('Hangulatos kreatív munkasarok.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

@font-face {
    font-family: 'MyCustomFont';
    src: url('animeace2_bld.otf') format('opentype');
}

h2 {
    font-family: 'MyCustomFont', sans-serif;
}

a {
    text-decoration: none;
    color: #000;
}


/* =========================================================
   TELEFON ELFORDÍTÁS ÜZENET
========================================================= */

.rotate-message {
    display: none;
}


/* =========================================================
   KÖNYV
========================================================= */

.flip-book {
    width: 500px;
    height: 650px;

    position: relative;

    perspective: 2000px;
}


/* Egy lap */

.page {
    width: 100%;
    height: 100%;

    position: absolute;

    top: 0;
    left: 0;

    transform-style: preserve-3d;
    transform-origin: left center;

    transition: transform 1s ease;
}


/* Lap eleje és hátulja */

.front,
.back {
    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    backface-visibility: hidden;

    border: 1px solid #ccc;

    box-shadow: 0 0 10px rgba(0,0,0,0.1);

    border-radius: 6px;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background-color: white;
}

.back {
    transform: rotateY(180deg);
}


/* =========================================================
   GOMBOK - PC
========================================================= */

.buttons {
    margin-top: 20px;
}

button {
    padding: 10px 20px;

    margin: 0 10px;

    font-size: 16px;

    cursor: pointer;
}


/* =========================================================
   MOBIL ÉRINTÉSI TERÜLETEK
========================================================= */

.mobile-touch-left,
.mobile-touch-right {
    display: none;
}


/* =========================================================
   MOBIL ÁLLÓ HELYZET
========================================================= */

@media (max-width: 600px) and (orientation: portrait) {

    body {
        background: #111;

        width: 100vw;
        height: 100vh;

        display: flex;

        align-items: center;
        justify-content: center;
    }

    /*
       A könyvet elrejtjük, amíg a telefon álló helyzetben van.
    */

    .flip-book {
        display: none;
    }

    /*
       A PC-s gombokat is elrejtjük.
    */

    .buttons {
        display: none;
    }

    /*
       Elfordításra felszólító üzenet
    */

    .rotate-message {
        display: flex;

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;

        box-sizing: border-box;

        z-index: 10000;

        color: white;

        font-family: 'MyCustomFont', Arial, sans-serif;

        font-size: clamp(22px, 7vw, 40px);

        line-height: 1.3;

        background: #111;
    }

}


/* =========================================================
   MOBIL FEKVŐ HELYZET
========================================================= */

@media (max-width: 900px) and (orientation: landscape) {

    html,
    body {
        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;
    }

    body {
        width: 100vw;
        height: 100vh;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;

        background-position: center;
        background-size: cover;
    }


    /*
       Az elfordításra felszólító szöveg eltűnik.
    */

    .rotate-message {
        display: none;
    }


    /*
       A könyv fekvő módban maximális magasságot kap,
       de megtartja az eredeti 500x650 arányt.

       Így az egész oldal belefér a kijelzőbe.
    */

    .flip-book {

        display: block;

        height: 94vh;

        width: auto;

        aspect-ratio: 500 / 650;

        position: relative;

        perspective: 1500px;

        flex-shrink: 0;
    }


    /*
       Mobilon nincs szükség a PC-s gombokra.
    */

    .buttons {
        display: none;
    }


    /*
       A lap pontosan kitölti a könyvet.
    */

    .page {
        width: 100%;
        height: 100%;
    }


    .front,
    .back {
        width: 100% !important;
        height: 100% !important;

        border: none;

        border-radius: 3px;

        box-shadow: 0 0 12px rgba(0,0,0,0.35);
    }


    /*
       Bal és jobb oldali érintési terület.
    */

    .mobile-touch-left,
    .mobile-touch-right {

        display: block;

        position: fixed;

        top: 0;

        height: 100vh;

        width: 50vw;

        z-index: 9999;

        background: transparent;

        -webkit-tap-highlight-color: transparent;

        touch-action: manipulation;
    }


    .mobile-touch-left {
        left: 0;
    }

    .mobile-touch-right {
        right: 0;
    }

}


/* =========================================================
   NAGYOBB MOBIL / TABLET FEKVŐ MÓD
========================================================= */

@media (min-width: 601px) and (max-width: 900px) and (orientation: landscape) {

    .flip-book {
        height: 92vh;
        width: auto;
        aspect-ratio: 500 / 650;
    }

}


/* =========================================================
   NAGYON ALACSONY KIJELZŐ
========================================================= */

@media (max-height: 400px) and (orientation: landscape) {

    .flip-book {
        height: 90vh;
        width: auto;
        aspect-ratio: 500 / 650;
    }

}


/* =========================================================
   IPHONE / SAFE AREA
========================================================= */

@supports (padding: env(safe-area-inset-top)) {

    @media (max-width: 900px) and (orientation: landscape) {

        body {
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);

            box-sizing: border-box;
        }

    }

}

</style>
</head>


<body>


<!-- =====================================================
     ELFORDÍTÁSI ÜZENET
===================================================== -->

<div class="rotate-message">
    FORDÍTSD OLDALRA A TELEFONT!
</div>



<!-- =====================================================
     KÖNYV
===================================================== -->

<div class="flip-book" id="flipBook">


    <!-- BORÍTÓ -->

    <div class="page" data-index="0">

        <div
            class="front"
            style="
                background-image:url('Borito.png');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div class="back">

            <div
                class="front"
                style="
                    background-image:url('borito belső.png');
                    background-size:100% 100%;
                    background-position:center;
                    background-repeat:no-repeat;
                ">
            </div>

        </div>

    </div>



    <!-- 1 - 2 -->

    <div class="page" data-index="1">

        <div
            class="front"
            style="
                background-image:url('1. oldal.png');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div
            class="back"
            style="
                background-image:url('2. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 3 - 4 -->

    <div class="page" data-index="2">

        <div
            class="front"
            style="
                background-image:url('3. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div
            class="back"
            style="
                background-image:url('4. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 5 - 6 -->

    <div class="page" data-index="3">

        <div
            class="front"
            style="
                background-image:url('5. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div
            class="back"
            style="
                background-image:url('6. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 7 - 8 -->

    <div class="page" data-index="4">

        <div
            class="front"
            style="
                background-image:url('7. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div
            class="back"
            style="
                background-image:url('8. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 9 - HÁTSÓ BORÍTÓ -->

    <div class="page" data-index="5">

        <div
            class="front"
            style="
                background-image:url('9. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div
            class="back"
            style="
                background-image:url('back.png');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>

</div>



<!-- =====================================================
     PC GOMBOK
===================================================== -->

<div class="buttons">

    <button onclick="prevPage()">
        Vissza
    </button>

    <button onclick="nextPage()">
        Előre
    </button>

</div>



<!-- =====================================================
     MOBIL ÉRINTÉSI TERÜLETEK
===================================================== -->

<div
    class="mobile-touch-left"
    id="mobileLeft">
</div>


<div
    class="mobile-touch-right"
    id="mobileRight">
</div>



<script>

/* =========================================================
   OLDALAK
========================================================= */

const pages = Array.from(
    document.querySelectorAll('.page')
);

let current = -1;

let flipping = false;


/* =========================================================
   OLDALAK FRISSÍTÉSE
========================================================= */

function updatePages(direction) {

    pages.forEach((page, index) => {

        /*
           Kezdőállapot
        */

        if (current === -1) {

            page.style.transform =
                'rotateY(0deg)';

            page.style.zIndex =
                pages.length - index;

        }


        /*
           Már átfordított oldalak
        */

        else if (index < current) {

            page.style.transform =
                'rotateY(-180deg)';

            page.style.zIndex =
                index;

        }


        /*
           Aktuálisan forgó oldal
        */

        else if (index === current) {

            page.style.transform =
                direction === 'next'
                    ? 'rotateY(-180deg)'
                    : 'rotateY(0deg)';

            page.style.zIndex = 200;

        }


        /*
           Még nem lapozott oldalak
        */

        else {

            page.style.transform =
                'rotateY(0deg)';

            page.style.zIndex =
                pages.length - index;

        }

    });

}


/* =========================================================
   KÖVETKEZŐ OLDAL
========================================================= */

function nextPage() {

    if (
        current < pages.length - 1 &&
        !flipping
    ) {

        flipping = true;

        current++;

        updatePages('next');

        setTimeout(() => {

            flipping = false;

        }, 1000);

    }

}


/* =========================================================
   ELŐZŐ OLDAL
========================================================= */

function prevPage() {

    if (
        current > -1 &&
        !flipping
    ) {

        flipping = true;

        updatePages('prev');

        current--;

        setTimeout(() => {

            flipping = false;

        }, 1000);

    }

}


/* =========================================================
   MOBIL ÉRINTÉS
========================================================= */

const mobileLeft =
    document.getElementById('mobileLeft');

const mobileRight =
    document.getElementById('mobileRight');


/*
   Bal oldal megérintése = vissza
*/

mobileLeft.addEventListener(
    'touchstart',
    function(e) {

        e.preventDefault();

        prevPage();

    },
    {
        passive: false
    }
);


/*
   Jobb oldal megérintése = előre
*/

mobileRight.addEventListener(
    'touchstart',
    function(e) {

        e.preventDefault();

        nextPage();

    },
    {
        passive: false
    }
);


/* =========================================================
   INDULÁSI ÁLLAPOT
========================================================= */

updatePages('next');

</script>

</body>
</html>
