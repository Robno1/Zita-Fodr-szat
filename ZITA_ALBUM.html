<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ZITA</title>


<style>

/* =========================================
   ALAP
========================================= */

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

}


body {

  font-family: Arial, sans-serif;

  background-image:
    url('Hangulatos kreatív munkasarok.jpg');

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}


/* =========================================
   FONT
========================================= */

@font-face {

  font-family: 'MyCustomFont';

  src:
    url('animeace2_bld.otf')
    format('opentype');

}


h2 {

  font-family:
    'MyCustomFont',
    sans-serif;

}


a {

  text-decoration: none;

  color: #000000;

}


/* =========================================
   KÖNYV - DESKTOP
========================================= */

.flip-book {

  width: 500px;

  height: 650px;

  position: relative;

  perspective: 2000px;

}


/* =========================================
   OLDAL
========================================= */

.page {

  width: 100%;

  height: 100%;

  position: absolute;

  top: 0;
  left: 0;

  transform-style: preserve-3d;

  transform-origin: left center;

  transition:
    transform 1s ease;

}


.front,
.back {

  position: absolute;

  width: 100%;
  height: 100%;

  top: 0;
  left: 0;

  backface-visibility: hidden;

  border: 1px solid #ccc;

  box-shadow:
    0 0 10px rgba(0,0,0,0.1);

  border-radius: 6px;

  overflow: hidden;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background-color: white;

}


.back {

  transform: rotateY(180deg);

}


/* =========================================
   GOMBOK
========================================= */

.buttons {

  margin-top: 20px;

}


button {

  padding: 10px 20px;

  margin: 0 10px;

  font-size: 16px;

  cursor: pointer;

}


/* =========================================
   MOBIL ÉRINTÉSI TERÜLETEK
========================================= */

.mobile-touch-left,
.mobile-touch-right {

  display: none;

}


/* =====================================================
   MOBIL
===================================================== */

@media (max-width: 500px) {

  body {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

  }


  /* -----------------------------------------
     KÖNYV MÉRETE ÁLLÓ TELEFONON
  ----------------------------------------- */

  .flip-book {

    width: 94vw;

    height: auto;

    aspect-ratio: 500 / 650;

    perspective: 1500px;

  }


  /* -----------------------------------------
     GOMBOK ELREJTÉSE
  ----------------------------------------- */

  .buttons {

    display: none;

  }


  /* -----------------------------------------
     OLDALAK
  ----------------------------------------- */

  .page {

    width: 100%;

    height: 100%;

  }


  .front,
  .back {

    width: 100% !important;

    height: 100% !important;

    border: none;

    border-radius: 4px;

    box-shadow:
      0 0 8px rgba(0,0,0,0.2);

  }


  /* -----------------------------------------
     ÉRINTÉSI TERÜLETEK
  ----------------------------------------- */

  .mobile-touch-left,
  .mobile-touch-right {

    display: block;

    position: fixed;

    top: 0;

    height: 100vh;

    width: 50vw;

    z-index: 9999;

    background: transparent;

    -webkit-tap-highlight-color:
      transparent;

    touch-action: manipulation;

  }


  .mobile-touch-left {

    left: 0;

  }


  .mobile-touch-right {

    right: 0;

  }

}


/* =====================================================
   FEKVŐ TELEFON
===================================================== */

@media (max-width: 900px) and (orientation: landscape) {

  body {

    width: 100vw;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

  }


  .flip-book {

    /*
      A könyv magassága igazodik
      a fekvő képernyőhöz.
    */

    height: 92vh;

    width: auto;

    aspect-ratio: 500 / 650;

    perspective: 1500px;

  }


  .front,
  .back {

    width: 100% !important;

    height: 100% !important;

  }


  .buttons {

    display: none;

  }


  .mobile-touch-left,
  .mobile-touch-right {

    display: block;

    position: fixed;

    top: 0;

    height: 100vh;

    width: 50vw;

    z-index: 9999;

    background: transparent;

    -webkit-tap-highlight-color:
      transparent;

    touch-action: manipulation;

  }


  .mobile-touch-left {

    left: 0;

  }


  .mobile-touch-right {

    right: 0;

  }

}

/* =========================================
   TÖLTŐKÉPERNYŐ
========================================= */

#loadingScreen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;

    background: #ffffff;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    z-index: 999999;

    transition: opacity 0.5s ease;
}

#loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-logo {
    width: 120px;
    max-width: 30vw;
    height: auto;

    margin-bottom: 25px;
}

.loading-text {
    font-family: Arial, sans-serif;
    font-size: 18px;
    color: #444;

    margin-bottom: 20px;
}

/* Forgó töltésjel */

.loader {
    width: 40px;
    height: 40px;

    border: 4px solid #ddd;
    border-top: 4px solid #444;

    border-radius: 50%;

    animation: loadingSpin 0.8s linear infinite;
}

@keyframes loadingSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================
   MOBIL - TELEFON FORDÍTÁSA
========================================= */

#rotateScreen {
    display: none;
}

@media (max-width: 900px) and (orientation: portrait) {

    #rotateScreen {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: #ffffff;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        z-index: 1000000;

        padding: 30px;
    }

    #rotateScreen .rotate-icon {
        font-size: 70px;
        line-height: 1;
        margin-bottom: 25px;
        color: #444;
    }

    #rotateScreen .rotate-title {
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
    }

    #rotateScreen .rotate-subtitle {
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: #777;
        max-width: 300px;
    }

    /* Álló telefonon a könyv ne legyen látható */
    .flip-book,
    .buttons,
    .mobile-touch-left,
    .mobile-touch-right {
        visibility: hidden;
    }

    /* Mobilon nincs PC-s loading screen */
    #loadingScreen {
        display: none !important;
    }
}

/* Fekvő mobilon a könyv normálisan jelenik meg */
@media (max-width: 900px) and (orientation: landscape) {

    #rotateScreen {
        display: none !important;
    }

    #loadingScreen {
        display: none !important;
    }

    .flip-book,
    .mobile-touch-left,
    .mobile-touch-right {
        visibility: visible;
    }
}

/* PC-n a loading screen működjön */
@media (min-width: 901px) {
    #loadingScreen {
        display: flex;
    }
}

</style>

</head>


<body>

<!-- =====================================================
     DESKTOP GOMBOK
===================================================== -->

<div class="buttons">

  <button onclick="prevPage()">
    Vissza
  </button>

  <button onclick="nextPage()">
    Előre
  </button>

<!-- =====================================================
     MOBIL ÉRINTÉSI TERÜLETEK
===================================================== -->

<div
  class="mobile-touch-left"
  id="mobileLeft">
</div>


<div
  class="mobile-touch-right"
  id="mobileRight">
</div>


<script>


/* =====================================================
   OLDALAK
===================================================== */

const pages =
  Array.from(
    document.querySelectorAll('.page')
  );


let current = -1;

let flipping = false;


/* =====================================================
   OLDALAK FRISSÍTÉSE
===================================================== */

function updatePages(direction) {

  pages.forEach(
    (page, index) => {

      if (current === -1) {

        /* Könyv csukva */

        page.style.transform =
          'rotateY(0deg)';

        page.style.zIndex =
          pages.length - index;

      }

      else if (index < current) {

        /* Már átfordított */

        page.style.transform =
          'rotateY(-180deg)';

        page.style.zIndex =
          index;

      }

      else if (index === current) {

        page.style.transform =
          direction === 'next'
            ? 'rotateY(-180deg)'
            : 'rotateY(0deg)';

        page.style.zIndex =
          200;

      }

      else {

        /* Még nem lapozott */

        page.style.transform =
          'rotateY(0deg)';

        page.style.zIndex =
          pages.length - index;

      }

    }
  );

}


/* =====================================================
   ELŐRE
===================================================== */

function nextPage() {

  if (
    current <
      pages.length - 1
    &&
    !flipping
  ) {

    flipping = true;

    current++;

    updatePages('next');


    setTimeout(
      () => {

        flipping = false;

      },
      1000
    );

  }

}


/* =====================================================
   VISSZA
===================================================== */

function prevPage() {

  if (
    current > -1
    &&
    !flipping
  ) {

    flipping = true;

    updatePages('prev');

    current--;


    setTimeout(
      () => {

        flipping = false;

      },
      1000
    );

  }

}


/* =====================================================
   MOBIL ÉRINTÉS
===================================================== */

const mobileLeft =
  document.getElementById(
    'mobileLeft'
  );


const mobileRight =
  document.getElementById(
    'mobileRight'
  );


/* BAL OLDAL */

mobileLeft.addEventListener(
  'touchstart',
  function(event) {

    event.preventDefault();

    prevPage();

  },
  {
    passive: false
  }
);


/* JOBB OLDAL */

mobileRight.addEventListener(
  'touchstart',
  function(event) {

    event.preventDefault();

    nextPage();

  },
  {
    passive: false
  }
);


/* =====================================================
   KEZDŐÁLLAPOT
===================================================== */

updatePages('next');

/* =========================================
   LOADING SCREEN - CSAK PC-N
========================================= */

window.addEventListener('load', async function () {

    /*
       900px vagy az alatt mobilnak tekintjük.
       Mobilon NINCS loading screen.
       Álló helyzetben a rotateScreen látszik,
       fekvő helyzetben pedig rögtön a könyv.
    */

    if (window.innerWidth <= 900) {
        return;
    }

    const loadingScreen =
        document.getElementById('loadingScreen');

    try {

        // Betűtípusok betöltésének megvárása
        if (document.fonts) {
            await document.fonts.ready;
        }

        // Az összes background-image megkeresése
        const elements =
            document.querySelectorAll('*');

        const imageUrls = [];

        elements.forEach(element => {

            const style =
                window.getComputedStyle(element);

            const backgroundImage =
                style.backgroundImage;

            if (
                backgroundImage &&
                backgroundImage !== 'none'
            ) {

                const matches =
                    backgroundImage.match(
                        /url\(["']?(.*?)["']?\)/g
                    );

                if (matches) {

                    matches.forEach(match => {

                        const url =
                            match
                                .replace(/^url\(["']?/, '')
                                .replace(/["']?\)$/, '');

                        if (!imageUrls.includes(url)) {
                            imageUrls.push(url);
                        }

                    });

                }

            }

        });

        // Normál <img> képek
        document.querySelectorAll('img').forEach(img => {

            if (img.src) {

                if (!imageUrls.includes(img.src)) {
                    imageUrls.push(img.src);
                }

            }

        });

        // Képek tényleges betöltése
        await Promise.all(

            imageUrls.map(url => {

                return new Promise(resolve => {

                    const img = new Image();

                    img.onload = resolve;
                    img.onerror = resolve;

                    img.src = url;

                });

            })

        );

        // Rövid késleltetés, majd loading eltüntetése
        setTimeout(() => {

            loadingScreen.classList.add('hidden');

            setTimeout(() => {

                loadingScreen.style.display = 'none';

            }, 500);

        }, 300);

    }

    catch (error) {

        console.log(
            'Betöltési hiba:',
            error
        );

        loadingScreen.classList.add('hidden');

        setTimeout(() => {

            loadingScreen.style.display = 'none';

        }, 500);

    }

});


</script>
