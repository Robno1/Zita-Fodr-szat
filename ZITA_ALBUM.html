<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ZITA</title>


<style>

/* =========================================
   ALAP
========================================= */

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

}


body {

  font-family: Arial, sans-serif;

  background-image:
    url('Hangulatos kreatív munkasarok.jpg');

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}


/* =========================================
   PC TÖLTŐKÉPERNYŐ
========================================= */

#loadingScreen {

  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;

  z-index: 999999;

  background-color: #000000;

  background-image:
    url('loading.png');

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

  display: flex;

  align-items: center;

  justify-content: center;

}


/* Mobilon a töltőképernyő mindig rejtve */

@media (max-width: 900px) {

  #loadingScreen {

    display: none !important;

  }

}


/* =========================================
   FONT
========================================= */

@font-face {

  font-family: 'MyCustomFont';

  src:
    url('animeace2_bld.otf')
    format('opentype');

}


h2 {

  font-family:
    'MyCustomFont',
    sans-serif;

}


a {

  text-decoration: none;

  color: #000000;

}


/* =========================================
   KÖNYV - DESKTOP
========================================= */

.flip-book {

  width: 500px;

  height: 650px;

  position: relative;

  perspective: 2000px;

}


/* =========================================
   OLDAL
========================================= */

.page {

  width: 100%;

  height: 100%;

  position: absolute;

  top: 0;
  left: 0;

  transform-style: preserve-3d;

  transform-origin: left center;

  transition:
    transform 1s ease;

}


.front,
.back {

  position: absolute;

  width: 100%;
  height: 100%;

  top: 0;
  left: 0;

  backface-visibility: hidden;

  border: 1px solid #ccc;

  box-shadow:
    0 0 10px rgba(0,0,0,0.1);

  border-radius: 6px;

  overflow: hidden;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background-color: white;

}


.back {

  transform: rotateY(180deg);

}


/* =========================================
   GOMBOK
========================================= */

.buttons {

  margin-top: 20px;

}


button {

  padding: 10px 20px;

  margin: 0 10px;

  font-size: 16px;

  cursor: pointer;

}


/* =========================================
   MOBIL ÉRINTÉSI TERÜLETEK
========================================= */

.mobile-touch-left,
.mobile-touch-right {

  display: none;

}


/* =====================================================
   MOBIL
===================================================== */

@media (max-width: 500px) {

  body {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

  }


  /* -----------------------------------------
     KÖNYV MÉRETE ÁLLÓ TELEFONON
  ----------------------------------------- */

  .flip-book {

    width: 94vw;

    height: auto;

    aspect-ratio: 500 / 650;

    perspective: 1500px;

  }


  /* -----------------------------------------
     GOMBOK ELREJTÉSE
  ----------------------------------------- */

  .buttons {

    display: none;

  }


  /* -----------------------------------------
     OLDALAK
  ----------------------------------------- */

  .page {

    width: 100%;

    height: 100%;

  }


  .front,
  .back {

    width: 100% !important;

    height: 100% !important;

    border: none;

    border-radius: 4px;

    box-shadow:
      0 0 8px rgba(0,0,0,0.2);

  }


  /* -----------------------------------------
     ÉRINTÉSI TERÜLETEK
  ----------------------------------------- */

  .mobile-touch-left,
  .mobile-touch-right {

    display: block;

    position: fixed;

    top: 0;

    height: 100vh;

    width: 50vw;

    z-index: 9999;

    background: transparent;

    -webkit-tap-highlight-color:
      transparent;

    touch-action: manipulation;

  }


  .mobile-touch-left {

    left: 0;

  }


  .mobile-touch-right {

    right: 0;

  }

}


/* =====================================================
   FEKVŐ TELEFON
===================================================== */

@media (max-width: 900px) and (orientation: landscape) {

  body {

    width: 100vw;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

  }


  .flip-book {

    /*
      A könyv magassága igazodik
      a fekvő képernyőhöz.
    */

    height: 92vh;

    width: auto;

    aspect-ratio: 500 / 650;

    perspective: 1500px;

  }


  .front,
  .back {

    width: 100% !important;

    height: 100% !important;

  }


  .buttons {

    display: none;

  }


  .mobile-touch-left,
  .mobile-touch-right {

    display: block;

    position: fixed;

    top: 0;

    height: 100vh;

    width: 50vw;

    z-index: 9999;

    background: transparent;

    -webkit-tap-highlight-color:
      transparent;

    touch-action: manipulation;

  }


  .mobile-touch-left {

    left: 0;

  }


  .mobile-touch-right {

    right: 0;

  }

}

</style>

</head>


<body>

    <div

  <!-- =========================================

<!-- =====================================================
     DESKTOP GOMBOK
===================================================== -->

<div class="buttons">

  <button onclick="prevPage()">
    Vissza
  </button>

  <button onclick="nextPage()">
    Előre
  </button>

</div>


<!-- =====================================================
     MOBIL ÉRINTÉSI TERÜLETEK
===================================================== -->

<div
  class="mobile-touch-left"
  id="mobileLeft">
</div>


<div
  class="mobile-touch-right"
  id="mobileRight">
</div>


<script>


/* =====================================================
   PC TÖLTŐKÉPERNYŐ
===================================================== */

const loadingScreen =
  document.getElementById('loadingScreen');


/*
   Csak PC-n működik a töltőképernyő.
   Mobilon azonnal eltűnik.
*/

function isPC() {

  return window.innerWidth > 900;

}


/*
   A könyv összes képének megvárása.
*/

function waitForImages() {

  const images = [];

  document
    .querySelectorAll('*')
    .forEach(element => {

      const style =
        window.getComputedStyle(element);

      const background =
        style.backgroundImage;

      if (
        background &&
        background !== 'none'
      ) {

        const match =
          background.match(
            /url\(["']?(.*?)["']?\)/
          );

        if (match && match[1]) {

          const image =
            new Image();

          image.src =
            match[1];

          images.push(image);

        }

      }

    });


  return Promise.all(

    images.map(image => {

      return new Promise(resolve => {

        if (image.complete) {

          resolve();

        }

        else {

          image.onload =
            resolve;

          image.onerror =
            resolve;

        }

      });

    })

  );

}


/*
   Ha minden kép betöltődött,
   eltűnik a loading screen.
*/

if (isPC()) {

  waitForImages()
    .then(() => {

      loadingScreen.style.display =
        'none';

    });

}

else {

  loadingScreen.style.display =
    'none';

}


/* =====================================================
   OLDALAK
===================================================== */

const pages =
  Array.from(
    document.querySelectorAll('.page')
  );


let current = -1;

let flipping = false;


/* =====================================================
   OLDALAK FRISSÍTÉSE
===================================================== */

function updatePages(direction) {

  pages.forEach(
    (page, index) => {

      if (current === -1) {

        /* Könyv csukva */

        page.style.transform =
          'rotateY(0deg)';

        page.style.zIndex =
          pages.length - index;

      }

      else if (index < current) {

        /* Már átfordított */

        page.style.transform =
          'rotateY(-180deg)';

        page.style.zIndex =
          index;

      }

      else if (index === current) {

        page.style.transform =
          direction === 'next'
            ? 'rotateY(-180deg)'
            : 'rotateY(0deg)';

        page.style.zIndex =
          200;

      }

      else {

        /* Még nem lapozott */

        page.style.transform =
          'rotateY(0deg)';

        page.style.zIndex =
          pages.length - index;

      }

    }
  );

}


/* =====================================================
   ELŐRE
===================================================== */

function nextPage() {

  if (
    current <
      pages.length - 1
    &&
    !flipping
  ) {

    flipping = true;

    current++;

    updatePages('next');


    setTimeout(
      () => {

        flipping = false;

      },
      1000
    );

  }

}


/* =====================================================
   VISSZA
===================================================== */

function prevPage() {

  if (
    current > -1
    &&
    !flipping
  ) {

    flipping = true;

    updatePages('prev');

    current--;


    setTimeout(
      () => {

        flipping = false;

      },
      1000
    );

  }

}


/* =====================================================
   MOBIL ÉRINTÉS
===================================================== */

const mobileLeft =
  document.getElementById(
    'mobileLeft'
  );


const mobileRight =
  document.getElementById(
    'mobileRight'
  );


/* BAL OLDAL */

mobileLeft.addEventListener(
  'touchstart',
  function(event) {

    event.preventDefault();

    prevPage();

  },
  {
    passive: false
  }
);


/* JOBB OLDAL */

mobileRight.addEventListener(
  'touchstart',
  function(event) {

    event.preventDefault();

    nextPage();

  },
  {
    passive: false
  }
);


/* =====================================================
   KEZDŐÁLLAPOT
===================================================== */

updatePages('next');


</script>
