<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Z Fodrászat & Massage</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

/* =========================================================
   ALAP
========================================================= */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    background-image: url('Hangulatos kreatív munkasarok.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   BETŰTÍPUS
========================================================= */

@font-face {
    font-family: 'MyCustomFont';
    src: url('animeace2_bld.otf') format('opentype');
}

h2 {
    font-family: 'MyCustomFont', sans-serif;
}

a {
    text-decoration: none;
    color: #000;
}


/* =========================================================
   PC LOADING SCREEN
========================================================= */

#loadingScreen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background: #111;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    z-index: 999999;

    opacity: 1;

    visibility: visible;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
}


/* Loading szöveg */

.loading-text {

    color: white;

    font-family:
        'MyCustomFont',
        Arial,
        sans-serif;

    font-size: 28px;

    letter-spacing: 2px;

    text-align: center;

    margin-bottom: 25px;
}


/* Forgó loading kör */

.loading-spinner {

    width: 45px;
    height: 45px;

    border: 4px solid rgba(255,255,255,0.25);

    border-top: 4px solid white;

    border-radius: 50%;

    animation:
        loadingSpin 0.9s linear infinite;
}


@keyframes loadingSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* Loading eltűnése */

#loadingScreen.loaded {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================================================
   ELFORDÍTÁSI ÜZENET
========================================================= */

.rotate-message {
    display: none;
}


/* =========================================================
   KÖNYV
========================================================= */

.flip-book {

    width: 500px;
    height: 650px;

    position: relative;

    perspective: 2000px;
}


/* =========================================================
   LAP
========================================================= */

.page {

    width: 100%;
    height: 100%;

    position: absolute;

    top: 0;
    left: 0;

    transform-style: preserve-3d;

    transform-origin: left center;

    transition:
        transform 1s ease;
}


/* =========================================================
   LAP ELEJE / HÁTULJA
========================================================= */

.front,
.back {

    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    backface-visibility: hidden;

    border: 1px solid #ccc;

    box-shadow:
        0 0 10px rgba(0,0,0,0.1);

    border-radius: 6px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background-color: white;
}

.back {
    transform: rotateY(180deg);
}


/* =========================================================
   PC GOMBOK
========================================================= */

.buttons {

    margin-top: 20px;
}

button {

    padding: 10px 20px;

    margin: 0 10px;

    font-size: 16px;

    cursor: pointer;
}


/* =========================================================
   MOBIL ÉRINTÉSI TERÜLETEK
========================================================= */

.mobile-touch-left,
.mobile-touch-right {

    display: none;
}


/* =========================================================
   MOBIL - ÁLLÓ HELYZET
========================================================= */

@media (max-width: 600px) and (orientation: portrait) {

    body {

        width: 100vw;
        height: 100vh;

        background: #111;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;
    }


    /*
       Loading screen mobilon NEM jelenik meg.
    */

    #loadingScreen {

        display: none !important;
    }


    /*
       Könyv elrejtése álló helyzetben.
    */

    .flip-book {

        display: none;
    }


    /*
       PC gombok elrejtése.
    */

    .buttons {

        display: none;
    }


    /*
       Elfordítási üzenet.
    */

    .rotate-message {

        display: flex;

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;

        box-sizing: border-box;

        z-index: 10000;

        color: white;

        background: #111;

        font-family:
            'MyCustomFont',
            Arial,
            sans-serif;

        font-size:
            clamp(22px, 7vw, 40px);

        line-height: 1.3;
    }

}


/* =========================================================
   MOBIL - FEKVŐ HELYZET
========================================================= */

@media (max-width: 900px) and (orientation: landscape) {

    html,
    body {

        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;
    }


    body {

        width: 100vw;

        height: 100dvh;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;

        background-position: center;
        background-size: cover;
    }


    /*
       Loading screen mobilon NEM jelenik meg.
    */

    #loadingScreen {

        display: none !important;
    }


    /*
       Elfordítási üzenet eltűnik.
    */

    .rotate-message {

        display: none;
    }


    /*
       Könyv méretezése.

       Mindig teljes egészében belefér
       a telefon kijelzőjébe.
    */

    .flip-book {

        display: block;

        position: relative;

        height: calc(100dvh - 16px);

        width: auto;

        aspect-ratio: 500 / 650;

        max-height: calc(100dvh - 16px);

        max-width: calc(100vw - 16px);

        perspective: 1500px;

        flex-shrink: 0;

        margin: 0 auto;
    }


    /*
       PC gombok eltűnnek.
    */

    .buttons {

        display: none;
    }


    .page {

        width: 100%;
        height: 100%;
    }


    .front,
    .back {

        width: 100% !important;
        height: 100% !important;

        border: none;

        border-radius: 0;

        box-shadow: none;
    }


    /*
       Bal oldal = előző oldal
    */

    .mobile-touch-left,
    .mobile-touch-right {

        display: block;

        position: fixed;

        top: 0;

        height: 100dvh;

        width: 50vw;

        z-index: 9999;

        background: transparent;

        -webkit-tap-highlight-color: transparent;

        touch-action: manipulation;
    }


    .mobile-touch-left {

        left: 0;
    }


    /*
       Jobb oldal = következő oldal
    */

    .mobile-touch-right {

        right: 0;
    }

}


/* =========================================================
   TABLET FEKVŐ
========================================================= */

@media (min-width: 601px)
       and (max-width: 900px)
       and (orientation: landscape) {

    .flip-book {

        height: calc(100dvh - 20px);

        width: auto;

        aspect-ratio: 500 / 650;

        max-height: calc(100dvh - 20px);

        max-width: calc(100vw - 20px);
    }

}


/* =========================================================
   NAGYON ALACSONY FEKVŐ KIJELZŐ
========================================================= */

@media (max-height: 400px)
       and (orientation: landscape) {

    .flip-book {

        height: calc(100dvh - 10px);

        max-height: calc(100dvh - 10px);

        width: auto;

        aspect-ratio: 500 / 650;
    }

}


/* =========================================================
   IPHONE SAFE AREA
========================================================= */

@supports (padding: env(safe-area-inset-left)) {

    @media (max-width: 900px)
           and (orientation: landscape) {

        body {

            padding-left:
                env(safe-area-inset-left);

            padding-right:
                env(safe-area-inset-right);

            box-sizing: border-box;
        }

    }

}

</style>
</head>


<body>

<!-- =====================================================
     PC GOMBOK
========================================================= -->

<div class="buttons">

    <button onclick="prevPage()">
        Vissza
    </button>

    <button onclick="nextPage()">
        Előre
    </button>

</div>



<!-- =====================================================
     MOBIL ÉRINTÉSI TERÜLETEK
========================================================= -->

<div
    class="mobile-touch-left"
    id="mobileLeft">
</div>


<div
    class="mobile-touch-right"
    id="mobileRight">
</div>



<script>

/* =========================================================
   PC LOADING
========================================================= */

const isMobile =
    window.matchMedia(
        '(max-width: 900px)'
    ).matches;


/*
   Csak PC-n fut le a loading rendszer.
*/

if (!isMobile) {

    const loadingScreen =
        document.getElementById(
            'loadingScreen'
        );


    /*
       Megvárjuk az összes képet.
    */

    const images = [

        'Hangulatos kreatív munkasarok.jpg',

        'Borito.png',
        'borito belső.png',

        '1. oldal.png',
        '2. oldal.jpg',

        '3. oldal.jpg',
        '4. oldal.jpg',

        '5. oldal.jpg',
        '6. oldal.jpg',

        '7. oldal.jpg',
        '8. oldal.jpg',

        '9. oldal.jpg',
        'back.png'
    ];


    let loadedImages = 0;


    function imageLoaded() {

        loadedImages++;

        if (
            loadedImages >=
            images.length
        ) {

            finishLoading();

        }

    }


    function finishLoading() {

        /*
           Egy kis késleltetés,
           hogy ne villanjon fel
           nagyon rövid ideig a loading.
        */

        setTimeout(() => {

            loadingScreen.classList.add(
                'loaded'
            );

        }, 300);

    }


    images.forEach(
        function(src) {

            const img =
                new Image();

            img.onload =
                imageLoaded;

            img.onerror =
                imageLoaded;

            img.src = src;

        }
    );


    /*
       A custom font betöltését is megvárjuk,
       ha a böngésző támogatja.
    */

    if (
        document.fonts &&
        document.fonts.ready
    ) {

        document.fonts.ready.then(
            function() {

                /*
                   A képek betöltését
                   továbbra is az
                   imageLoaded kezeli.
                */

            }
        );

    }

}


/* =========================================================
   OLDALAK
========================================================= */

const pages =
    Array.from(
        document.querySelectorAll('.page')
    );

let current = -1;

let flipping = false;


/* =========================================================
   OLDALAK FRISSÍTÉSE
========================================================= */

function updatePages(direction) {

    pages.forEach(
        (page, index) => {

            if (current === -1) {

                page.style.transform =
                    'rotateY(0deg)';

                page.style.zIndex =
                    pages.length - index;

            }

            else if (index < current) {

                page.style.transform =
                    'rotateY(-180deg)';

                page.style.zIndex =
                    index;

            }

            else if (index === current) {

                page.style.transform =
                    direction === 'next'
                        ? 'rotateY(-180deg)'
                        : 'rotateY(0deg)';

                page.style.zIndex = 200;

            }

            else {

                page.style.transform =
                    'rotateY(0deg)';

                page.style.zIndex =
                    pages.length - index;

            }

        }
    );

}


/* =========================================================
   KÖVETKEZŐ OLDAL
========================================================= */

function nextPage() {

    if (
        current < pages.length - 1 &&
        !flipping
    ) {

        flipping = true;

        current++;

        updatePages('next');

        setTimeout(
            () => {

                flipping = false;

            },
            1000
        );

    }

}


/* =========================================================
   ELŐZŐ OLDAL
========================================================= */

function prevPage() {

    if (
        current > -1 &&
        !flipping
    ) {

        flipping = true;

        updatePages('prev');

        current--;

        setTimeout(
            () => {

                flipping = false;

            },
            1000
        );

    }

}


/* =========================================================
   MOBIL LAPOZÁS
========================================================= */

const mobileLeft =
    document.getElementById(
        'mobileLeft'
    );

const mobileRight =
    document.getElementById(
        'mobileRight'
    );


/* Bal oldal = előző */

mobileLeft.addEventListener(
    'touchstart',
    function(e) {

        e.preventDefault();

        prevPage();

    },
    {
        passive: false
    }
);


/* Jobb oldal = következő */

mobileRight.addEventListener(
    'touchstart',
    function(e) {

        e.preventDefault();

        nextPage();

    },
    {
        passive: false
    }
);


/* =========================================================
   KEZDŐÁLLAPOT
========================================================= */

updatePages('next');

</script>
