<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>ZITA</title>

<style>

/* =========================================================
   ALAP
========================================================= */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    background-image: url('Hangulatos kreatív munkasarok.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

@font-face {
    font-family: 'MyCustomFont';
    src: url('animeace2_bld.otf') format('opentype');
}

h2 {
    font-family: 'MyCustomFont', sans-serif;
}

a {
    text-decoration: none;
    color: #000;
}


/* =========================================================
   ELFORDÍTÁSI ÜZENET
========================================================= */

.rotate-message {
    display: none;
}


/* =========================================================
   KÖNYV
========================================================= */

.flip-book {
    width: 500px;
    height: 650px;

    position: relative;

    perspective: 2000px;
}


/* =========================================================
   LAP
========================================================= */

.page {
    width: 100%;
    height: 100%;

    position: absolute;

    top: 0;
    left: 0;

    transform-style: preserve-3d;

    transform-origin: left center;

    transition: transform 1s ease;
}


/* =========================================================
   LAP ELEJE / HÁTULJA
========================================================= */

.front,
.back {
    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    backface-visibility: hidden;

    border: 1px solid #ccc;

    box-shadow: 0 0 10px rgba(0,0,0,0.1);

    border-radius: 6px;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background-color: white;
}

.back {
    transform: rotateY(180deg);
}


/* =========================================================
   PC GOMBOK
========================================================= */

.buttons {
    margin-top: 20px;
}

button {
    padding: 10px 20px;

    margin: 0 10px;

    font-size: 16px;

    cursor: pointer;
}


/* =========================================================
   MOBIL ÉRINTÉSI TERÜLETEK
========================================================= */

.mobile-touch-left,
.mobile-touch-right {
    display: none;
}


/* =========================================================
   MOBIL - ÁLLÓ HELYZET
========================================================= */

@media (max-width: 600px) and (orientation: portrait) {

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        width: 100vw;
        height: 100vh;

        background: #111;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;
    }


    /*
       Álló módban a könyv teljesen eltűnik.
    */

    .flip-book {
        display: none;
    }


    /*
       PC gombok eltűnnek.
    */

    .buttons {
        display: none;
    }


    /*
       Elfordításra felszólító szöveg.
    */

    .rotate-message {

        display: flex;

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;

        box-sizing: border-box;

        z-index: 10000;

        color: white;

        background: #111;

        font-family:
            'MyCustomFont',
            Arial,
            sans-serif;

        font-size: clamp(22px, 7vw, 40px);

        line-height: 1.3;
    }

}


/* =========================================================
   MOBIL - FEKVŐ HELYZET
   TELJES KÖNYVNEK BE KELL FÉRNIE
========================================================= */

@media (max-width: 900px) and (orientation: landscape) {

    html,
    body {
        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;
    }


    body {

        width: 100vw;

        /*
           A dvh a telefon ténylegesen látható
           magasságát használja.
        */

        height: 100dvh;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;

        background-position: center;
        background-size: cover;
    }


    /*
       Az "elfordítás" szöveg eltűnik.
    */

    .rotate-message {
        display: none;
    }


    /*
       A könyv méretezése.

       A könyv eredeti aránya:
       500 x 650

       A magasságot a kijelzőhöz igazítjuk,
       ezért nem fog lelógni az aljáról.
    */

    .flip-book {

        display: block;

        position: relative;

        height: calc(100dvh - 16px);

        width: auto;

        aspect-ratio: 500 / 650;

        max-height: calc(100dvh - 16px);

        max-width: calc(100vw - 16px);

        perspective: 1500px;

        flex-shrink: 0;

        margin: 0 auto;
    }


    /*
       PC-s gombok eltűnnek.
    */

    .buttons {
        display: none;
    }


    /*
       A lapok pontosan kitöltik a könyvet.
    */

    .page {

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;
    }


    /*
       Mobilon nincs keret,
       így minden pixel a könyvhöz tartozik.
    */

    .front,
    .back {

        width: 100% !important;

        height: 100% !important;

        border: none;

        border-radius: 0;

        box-shadow: none;
    }


    /*
       Bal oldal = előző oldal
    */

    .mobile-touch-left,
    .mobile-touch-right {

        display: block;

        position: fixed;

        top: 0;

        height: 100dvh;

        width: 50vw;

        z-index: 9999;

        background: transparent;

        -webkit-tap-highlight-color: transparent;

        touch-action: manipulation;
    }


    .mobile-touch-left {
        left: 0;
    }


    /*
       Jobb oldal = következő oldal
    */

    .mobile-touch-right {
        right: 0;
    }

}


/* =========================================================
   NAGYOBB TABLET FEKVŐ MÓDBAN
========================================================= */

@media (min-width: 601px) and (max-width: 900px) and (orientation: landscape) {

    .flip-book {

        height: calc(100dvh - 20px);

        width: auto;

        aspect-ratio: 500 / 650;

        max-height: calc(100dvh - 20px);

        max-width: calc(100vw - 20px);
    }

}


/* =========================================================
   NAGYON ALACSONY FEKVŐ KIJELZŐ
========================================================= */

@media (max-height: 400px) and (orientation: landscape) {

    .flip-book {

        height: calc(100dvh - 10px);

        max-height: calc(100dvh - 10px);

        width: auto;

        aspect-ratio: 500 / 650;
    }

}


/* =========================================================
   IPHONE SAFE AREA
========================================================= */

@supports (padding: env(safe-area-inset-left)) {

    @media (max-width: 900px) and (orientation: landscape) {

        body {

            padding-left:
                env(safe-area-inset-left);

            padding-right:
                env(safe-area-inset-right);

            box-sizing: border-box;
        }

    }

}

</style>
</head>


<body>


<!-- =====================================================
     ELFORDÍTÁSI ÜZENET
===================================================== -->

<div class="rotate-message">
    FORDÍTSD OLDALRA A TELEFONT!
</div>



<!-- =====================================================
     KÖNYV
===================================================== -->

<div class="flip-book" id="flipBook">


    <!-- BORÍTÓ -->

    <div class="page" data-index="0">

        <div
            class="front"
            style="
                background-image:url('Borito.png');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>


        <div class="back">

            <div
                class="front"
                style="
                    background-image:url('borito belső.png');
                    background-size:100% 100%;
                    background-position:center;
                    background-repeat:no-repeat;
                ">
            </div>

        </div>

    </div>



    <!-- 1 - 2 -->

    <div class="page" data-index="1">

        <div
            class="front"
            style="
                background-image:url('1. oldal.png');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

        <div
            class="back"
            style="
                background-image:url('2. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 3 - 4 -->

    <div class="page" data-index="2">

        <div
            class="front"
            style="
                background-image:url('3. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

        <div
            class="back"
            style="
                background-image:url('4. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 5 - 6 -->

    <div class="page" data-index="3">

        <div
            class="front"
            style="
                background-image:url('5. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

        <div
            class="back"
            style="
                background-image:url('6. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 7 - 8 -->

    <div class="page" data-index="4">

        <div
            class="front"
            style="
                background-image:url('7. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

        <div
            class="back"
            style="
                background-image:url('8. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>



    <!-- 9 - HÁTSÓ BORÍTÓ -->

    <div class="page" data-index="5">

        <div
            class="front"
            style="
                background-image:url('9. oldal.jpg');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

        <div
            class="back"
            style="
                background-image:url('back.png');
                background-size:100% 100%;
                background-position:center;
                background-repeat:no-repeat;
            ">
        </div>

    </div>

</div>



<!-- =====================================================
     PC GOMBOK
========================================================= -->

<div class="buttons">

    <button onclick="prevPage()">
        Vissza
    </button>

    <button onclick="nextPage()">
        Előre
    </button>

</div>



<!-- =====================================================
     MOBIL ÉRINTÉSI TERÜLETEK
========================================================= -->

<div
    class="mobile-touch-left"
    id="mobileLeft">
</div>

<div
    class="mobile-touch-right"
    id="mobileRight">
</div>



<script>

/* =========================================================
   OLDALAK
========================================================= */

const pages =
    Array.from(
        document.querySelectorAll('.page')
    );

let current = -1;

let flipping = false;


/* =========================================================
   OLDALAK FRISSÍTÉSE
========================================================= */

function updatePages(direction) {

    pages.forEach((page, index) => {

        if (current === -1) {

            page.style.transform =
                'rotateY(0deg)';

            page.style.zIndex =
                pages.length - index;

        }

        else if (index < current) {

            page.style.transform =
                'rotateY(-180deg)';

            page.style.zIndex =
                index;

        }

        else if (index === current) {

            page.style.transform =
                direction === 'next'
                    ? 'rotateY(-180deg)'
                    : 'rotateY(0deg)';

            page.style.zIndex = 200;

        }

        else {

            page.style.transform =
                'rotateY(0deg)';

            page.style.zIndex =
                pages.length - index;

        }

    });

}


/* =========================================================
   KÖVETKEZŐ
========================================================= */

function nextPage() {

    if (
        current < pages.length - 1 &&
        !flipping
    ) {

        flipping = true;

        current++;

        updatePages('next');

        setTimeout(() => {

            flipping = false;

        }, 1000);
    }

}


/* =========================================================
   ELŐZŐ
========================================================= */

function prevPage() {

    if (
        current > -1 &&
        !flipping
    ) {

        flipping = true;

        updatePages('prev');

        current--;

        setTimeout(() => {

            flipping = false;

        }, 1000);
    }

}


/* =========================================================
   MOBIL LAPOZÁS
========================================================= */

const mobileLeft =
    document.getElementById('mobileLeft');

const mobileRight =
    document.getElementById('mobileRight');


/* Bal oldal = vissza */

mobileLeft.addEventListener(
    'touchstart',
    function(e) {

        e.preventDefault();

        prevPage();

    },
    {
        passive: false
    }
);


/* Jobb oldal = előre */

mobileRight.addEventListener(
    'touchstart',
    function(e) {

        e.preventDefault();

        nextPage();

    },
    {
        passive: false
    }
);


/* =========================================================
   KEZDŐÁLLAPOT
========================================================= */

updatePages('next');

</script>

</body>
</html>
